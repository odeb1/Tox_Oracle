[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toxoracle-discovery"
version = "0.1.0"
description = "Team A BioNeMo discovery-tool adapters for ToxOracle"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
chemistry = ["rdkit==2025.9.2"]

[project.scripts]
toxoracle-diffdock = "toxoracle_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
