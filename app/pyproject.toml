[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toxoracle-app"
version = "0.1.0"
description = "Offline validation and integration layer for ToxOracle"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
demo = [
  "streamlit==1.64.0",
  "plotly==6.9.0",
  "rdkit==2025.9.2",
]

[project.scripts]
toxoracle-combine = "toxoracle_app.cli:main"
toxoracle-screen = "toxoracle_app.screen_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toxoracle_app = ["demo.css"]
