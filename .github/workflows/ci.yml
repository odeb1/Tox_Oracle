name: Offline checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation-science:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up scientific Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            toxicity/requirements-model.lock
            app/pyproject.toml
            discovery/pyproject.toml

      - name: Install pinned scientific dependencies
        run: python3 -m pip install -r toxicity/requirements-model.lock -e app -e discovery

      - name: Check installed dependencies
        run: python3 -m pip check

      - name: Run generation tests without skips
        run: bash scripts/check-generation.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            app/requirements.lock

      - name: Install integration application
        run: python3 -m pip install -r app/requirements.lock -e app

      - name: Run offline checks
        run: ./scripts/check.sh

  streamlit-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-demo.lock
      - name: Install demo dependencies
        run: python3 -m pip install -r app/requirements-demo.lock
      - name: Check demo interactions offline
        run: bash scripts/check-demo.sh
